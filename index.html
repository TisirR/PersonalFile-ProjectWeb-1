<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal VRChat Space">
    <title>Ciallo～(∠・ω< )⌒★</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="backgroundLayer"></div>

    <main class="site-shell">
        <section class="profile-panel">
            <div class="avatar-wrap">
                <button id="avatarButton" class="avatar-button" type="button" aria-label="查看头像">
                    <img id="avatarImage" class="avatar-image" src="" alt="Avatar">
                    <div id="avatarFallback" class="avatar-fallback">:)</div>
                </button>
            </div>
            <h1 id="displayName" class="display-name">Loading...</h1>
            <p id="tagline" class="tagline">...</p>
            <div class="about-section">
                <div class="section-title-bubble">About Me</div>
                <div id="introduction" class="about-content">Loading...</div>
            </div>
        </section>

        <section id="informationShell" class="information-shell">
            <aside id="leftEar" class="ear ear-left collapsed">
                <button id="leftEarToggle" class="ear-handle" type="button" aria-label="展开左侧信息" aria-expanded="false">
                    <span class="ear-arrow">❯</span>
                </button>
                <div class="ear-content"><div id="leftCards" class="cards-column"></div></div>
            </aside>

            <div class="information-main">
                <div id="centerCards" class="cards-column center-cards"></div>
            </div>

            <aside id="rightEar" class="ear ear-right collapsed">
                <button id="rightEarToggle" class="ear-handle" type="button" aria-label="展开右侧信息" aria-expanded="false">
                    <span class="ear-arrow">❮</span>
                </button>
                <div class="ear-content"><div id="rightCards" class="cards-column"></div></div>
            </aside>
        </section>

        <aside id="galleryPanel" class="gallery-panel collapsed" aria-label="画廊">

    <button
        id="galleryToggle"
        class="gallery-handle"
        type="button"
        aria-label="展开画廊"
        aria-expanded="false"
    >
        <span class="gallery-arrow">❮</span>
    </button>

    <div class="gallery-content">

        <div class="gallery-title-bubble">
            画廊 Gallery
        </div>

        <div id="galleryList" class="gallery-list"></div>

    </div>

</aside>

        <div class="visitor-box"><span class="visitor-icon">◉</span><span>已有 <strong id="visitorCount">—</strong> 位访客来过这里</span></div>
        <footer class="site-footer"><span id="footerName">Personal Space</span><span class="footer-dot">·</span><span>VRChat / Personal Space</span></footer>
    </main>

    <div id="imageViewer" class="image-viewer" hidden>
        <button id="closeImageViewer" class="image-viewer-close" type="button">×</button>
        <img id="viewerImage" src="" alt="Preview">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/site.js"></script>
</body>
</html>
